<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel de tareas</title>

    <style>
        p {
            color: green;
        }
    </style>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <h1>Panel de tareas</h1>

    <p>Tarea 1: revisar el correo</p>
    <p class="urgente">Tarea 2: llamar al cliente</p>
    <p class="urgente" id="critica">Tarea 3: entregar el informe</p>
    <p class="urgente hecha">Tarea 4: enviar la factura</p>
    <p class="urgente revision" style="color: purple;">Tarea 5: preparar la reunión</p>

    <div class="notas">
        <p>Nota 1: el viernes hay revisión</p>
        <span>Nota 2: traer el portátil</span>
    </div>

</body>

</html>
